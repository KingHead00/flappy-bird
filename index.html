<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flappy Bird</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    :root {
      --sky-top: #4ec0ca;
      --sky-bottom: #a8e6cf;
      --pipe-green: #5ec75e;
      --pipe-dark: #3a8a3a;
      --pipe-light: #7fff7f;
      --ground-top: #ded895;
      --ground-bottom: #c8b060;
      --bird-yellow: #f7d038;
      --bird-orange: #f07020;
      --bird-white: #ffffff;
      --bird-eye: #333;
      --ui-color: #fff;
      --shadow: rgba(0,0,0,0.25);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Press Start 2P', monospace;
      overflow: hidden;
    }

    #game-wrapper {
      position: relative;
      width: 360px;
      height: 640px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(78,192,202,0.4), 0 0 120px rgba(78,192,202,0.15);
      border: 3px solid rgba(255,255,255,0.15);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    #ui-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #score-display {
      margin-top: 28px;
      font-size: 36px;
      color: var(--ui-color);
      text-shadow: 3px 3px 0 #555, 0 0 20px rgba(255,255,255,0.5);
      letter-spacing: 4px;
      transition: transform 0.1s;
    }
    #score-display.bump {
      transform: scale(1.3);
    }

    #screen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: all;
      cursor: pointer;
    }

    .screen-box {
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
      border: 3px solid rgba(255,255,255,0.2);
      border-radius: 16px;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .screen-title {
      font-size: 22px;
      color: #ffe94e;
      text-shadow: 3px 3px 0 #a06000;
      text-align: center;
      line-height: 1.6;
    }

    .screen-sub {
      font-size: 9px;
      color: #ddd;
      text-align: center;
      line-height: 2;
    }

    .screen-score {
      font-size: 14px;
      color: #fff;
      text-align: center;
      line-height: 2;
    }

    .tap-hint {
      font-size: 9px;
      color: rgba(255,255,255,0.7);
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .medal {
      font-size: 38px;
    }

    #best-badge {
      font-size: 8px;
      color: #ffe94e;
      background: rgba(0,0,0,0.3);
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255,228,78,0.4);
    }

    #instructions {
      margin-top: 14px;
      font-size: 8px;
      color: rgba(255,255,255,0.45);
      text-align: center;
      line-height: 1.9;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="game-wrapper">
  <canvas id="gameCanvas" width="360" height="640"></canvas>

  <div id="ui-overlay">
    <div id="score-display">0</div>

    <div id="screen">
      <div class="screen-box" id="start-screen">
        <div class="screen-title">🐦 FLAPPY<br>BIRD</div>
        <div class="screen-sub">Dodge the pipes<br>Score as high as you can!</div>
        <div class="tap-hint">[ TAP / CLICK / SPACE ]</div>
      </div>

      <div class="screen-box" id="over-screen" style="display:none;">
        <div class="screen-title">GAME OVER</div>
        <div class="medal" id="medal-icon">💀</div>
        <div class="screen-score" id="final-score">Score: 0</div>
        <div id="best-badge">🏆 BEST: 0</div>
        <div class="tap-hint">[ TAP TO RETRY ]</div>
      </div>
    </div>
  </div>
</div>

<div id="instructions">SPACE · CLICK · TAP to flap</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  // ── DOM refs ──────────────────────────────────────────
  const scoreDisplay  = document.getElementById('score-display');
  const screenEl      = document.getElementById('screen');
  const startScreen   = document.getElementById('start-screen');
  const overScreen    = document.getElementById('over-screen');
  const finalScore    = document.getElementById('final-score');
  const bestBadge     = document.getElementById('best-badge');
  const medalIcon     = document.getElementById('medal-icon');

  // ── Game config ───────────────────────────────────────
  const GRAVITY      = 0.45;
  const FLAP_FORCE   = -8.5;
  const PIPE_SPEED   = 2.8;
  const PIPE_GAP     = 160;
  const PIPE_WIDTH   = 58;
  const PIPE_INTERVAL= 1700; // ms
  const GROUND_H     = 80;
  const BIRD_X       = 90;

  // ── State ─────────────────────────────────────────────
  let state = 'start'; // start | playing | dead
  let score = 0;
  let best  = parseInt(localStorage.getItem('flappy_best') || '0');
  let bird, pipes, lastPipe, frame, animId, groundOffset;
  let flashTimer = 0;
  let deathBounce = 0;

  // ── Cloud positions (decorative) ──────────────────────
  const clouds = [
    { x: 60,  y: 80,  w: 80, speed: 0.3 },
    { x: 200, y: 50,  w: 100, speed: 0.2 },
    { x: 310, y: 110, w: 70, speed: 0.35 },
  ];

  // ── Bird object ───────────────────────────────────────
  function createBird() {
    return {
      x: BIRD_X,
      y: H / 2 - 60,
      vy: 0,
      radius: 16,
      rotation: 0,
      wingAngle: 0,
      wingDir: 1,
      alive: true,
    };
  }

  // ── Pipe generation ───────────────────────────────────
  function createPipe() {
    const minTop = 80;
    const maxTop = H - GROUND_H - PIPE_GAP - 80;
    const topH   = minTop + Math.random() * (maxTop - minTop);
    return { x: W + 20, topH };
  }

  // ── Init / reset ──────────────────────────────────────
  function init() {
    bird        = createBird();
    pipes       = [];
    score       = 0;
    frame       = 0;
    groundOffset= 0;
    lastPipe    = 0;
    flashTimer  = 0;
    deathBounce = 0;
    updateScoreDisplay(0);
  }

  // ── Flap ──────────────────────────────────────────────
  function flap() {
    if (state === 'start') {
      state = 'playing';
      startScreen.style.display = 'none';
      screenEl.style.pointerEvents = 'none';
      lastPipe = performance.now();
    }
    if (state === 'playing' && bird.alive) {
      bird.vy = FLAP_FORCE;
      bird.rotation = -28;
    }
    if (state === 'dead') {
      state = 'start';
      overScreen.style.display = 'none';
      startScreen.style.display = 'flex';
      screenEl.style.pointerEvents = 'all';
      init();
    }
  }

  // ── Input ─────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); flap(); }
  });
  document.getElementById('game-wrapper').addEventListener('pointerdown', flap);

  // ── Collision ─────────────────────────────────────────
  function checkCollision(pipe) {
    const bx = bird.x, by = bird.y, br = bird.radius - 3;
    const px = pipe.x, pw = PIPE_WIDTH;
    // horizontal overlap
    if (bx + br < px || bx - br > px + pw) return false;
    // vertical overlap with top or bottom pipe
    if (by - br < pipe.topH) return true;
    if (by + br > pipe.topH + PIPE_GAP) return true;
    return false;
  }

  // ── Score bump animation ──────────────────────────────
  function updateScoreDisplay(val) {
    scoreDisplay.textContent = val;
    scoreDisplay.classList.remove('bump');
    void scoreDisplay.offsetWidth;
    scoreDisplay.classList.add('bump');
    setTimeout(() => scoreDisplay.classList.remove('bump'), 120);
  }

  // ── Die ───────────────────────────────────────────────
  function die() {
    bird.alive = false;
    bird.vy = -6;
    flashTimer = 8;
    setTimeout(() => {
      state = 'dead';
      if (score > best) {
        best = score;
        localStorage.setItem('flappy_best', best);
      }
      finalScore.textContent = 'Score: ' + score;
      bestBadge.textContent  = '🏆 BEST: ' + best;
      medalIcon.textContent  = score >= 30 ? '🥇' : score >= 15 ? '🥈' : score >= 5 ? '🥉' : '💀';
      overScreen.style.display = 'flex';
      screenEl.style.pointerEvents = 'all';
    }, 900);
  }

  // ── Drawing helpers ───────────────────────────────────
  function drawSky() {
    const grad = ctx.createLinearGradient(0, 0, 0, H - GROUND_H);
    grad.addColorStop(0,   '#4ec0ca');
    grad.addColorStop(1,   '#b8e8f0');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H - GROUND_H);
  }

  function drawClouds() {
    clouds.forEach(c => {
      ctx.save();
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = '#fff';
      // puff cloud
      ctx.beginPath();
      ctx.arc(c.x,        c.y,      c.w * 0.3, 0, Math.PI * 2);
      ctx.arc(c.x + c.w*0.25, c.y - c.w*0.12, c.w*0.22, 0, Math.PI*2);
      ctx.arc(c.x + c.w*0.5,  c.y,  c.w*0.28, 0, Math.PI*2);
      ctx.arc(c.x + c.w*0.75, c.y + c.w*0.05, c.w*0.2, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    });
  }

  function drawGround() {
    // dirt
    const grad = ctx.createLinearGradient(0, H - GROUND_H, 0, H);
    grad.addColorStop(0, '#ded895');
    grad.addColorStop(1, '#c8b060');
    ctx.fillStyle = grad;
    ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
    // grass strip
    ctx.fillStyle = '#5abf5a';
    ctx.fillRect(0, H - GROUND_H, W, 12);
    // grass tufts
    ctx.fillStyle = '#3fa33f';
    for (let gx = ((groundOffset % 20) - 20); gx < W; gx += 20) {
      ctx.fillRect(gx, H - GROUND_H, 2, 10);
      ctx.fillRect(gx + 6, H - GROUND_H, 2, 14);
      ctx.fillRect(gx + 12, H - GROUND_H, 2, 8);
    }
    // ground line
    ctx.strokeStyle = '#a07830';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, H - GROUND_H + 12); ctx.lineTo(W, H - GROUND_H + 12);
    ctx.stroke();
  }

  function drawPipe(pipe) {
    const { x, topH } = pipe;
    const pw = PIPE_WIDTH;
    const capH = 22, capExtra = 6;

    // ── top pipe ─────────────────────────────────────────
    // body gradient
    let g = ctx.createLinearGradient(x, 0, x + pw, 0);
    g.addColorStop(0,    '#4aad4a');
    g.addColorStop(0.25, '#6dcc6d');
    g.addColorStop(0.75, '#4aad4a');
    g.addColorStop(1,    '#2e7a2e');
    ctx.fillStyle = g;
    ctx.fillRect(x, 0, pw, topH);
    // light stripe
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillRect(x + 8, 0, 8, topH);
    // cap
    g = ctx.createLinearGradient(x - capExtra, 0, x + pw + capExtra, 0);
    g.addColorStop(0,    '#3a9a3a');
    g.addColorStop(0.3,  '#68cc68');
    g.addColorStop(0.7,  '#3a9a3a');
    g.addColorStop(1,    '#1e6a1e');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.roundRect(x - capExtra, topH - capH, pw + capExtra * 2, capH, [4, 4, 0, 0]);
    ctx.fill();
    // cap highlight
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(x - capExtra + 8, topH - capH + 4, 12, capH - 8);

    // ── bottom pipe ───────────────────────────────────────
    const botY = topH + PIPE_GAP;
    const botH = H - GROUND_H - botY;
    g = ctx.createLinearGradient(x, 0, x + pw, 0);
    g.addColorStop(0,    '#4aad4a');
    g.addColorStop(0.25, '#6dcc6d');
    g.addColorStop(0.75, '#4aad4a');
    g.addColorStop(1,    '#2e7a2e');
    ctx.fillStyle = g;
    ctx.fillRect(x, botY, pw, botH);
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillRect(x + 8, botY, 8, botH);
    // cap
    g = ctx.createLinearGradient(x - capExtra, 0, x + pw + capExtra, 0);
    g.addColorStop(0,    '#3a9a3a');
    g.addColorStop(0.3,  '#68cc68');
    g.addColorStop(0.7,  '#3a9a3a');
    g.addColorStop(1,    '#1e6a1e');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.roundRect(x - capExtra, botY, pw + capExtra * 2, capH, [0, 0, 4, 4]);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(x - capExtra + 8, botY + 4, 12, capH - 8);
  }

  function drawBird() {
    const { x, y, rotation, wingAngle } = bird;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation * Math.PI / 180);

    const r = bird.radius;

    // shadow
    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(2, r + 4, r * 0.8, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // wing (behind body)
    ctx.save();
    ctx.fillStyle = '#e8a820';
    ctx.beginPath();
    const wingY = Math.sin(wingAngle) * 5;
    ctx.ellipse(-4, 2 + wingY, r * 0.6, r * 0.35, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // body
    let bg = ctx.createRadialGradient(-4, -4, 2, 0, 0, r);
    bg.addColorStop(0, '#ffe84e');
    bg.addColorStop(0.6, '#f7c818');
    bg.addColorStop(1,   '#d99000');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();

    // belly
    ctx.fillStyle = 'rgba(255,255,220,0.55)';
    ctx.beginPath();
    ctx.ellipse(3, 4, r * 0.55, r * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();

    // eye white
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(6, -4, 6, 0, Math.PI * 2);
    ctx.fill();
    // pupil
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(7.5, -4, 3, 0, Math.PI * 2);
    ctx.fill();
    // gleam
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(8.5, -5.5, 1.2, 0, Math.PI * 2);
    ctx.fill();

    // beak
    ctx.fillStyle = '#f07828';
    ctx.beginPath();
    ctx.moveTo(r - 2, -1);
    ctx.lineTo(r + 9, 2);
    ctx.lineTo(r - 2, 6);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#c05010';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.restore();
  }

  // ── Main update loop ──────────────────────────────────
  function update(now) {
    frame++;

    // clouds drift
    clouds.forEach(c => {
      c.x -= c.speed;
      if (c.x + c.w < 0) c.x = W + 20;
    });

    if (state !== 'playing') {
      // idle hover on start/dead screen
      if (bird.alive || state === 'start') {
        bird.y = H / 2 - 60 + Math.sin(frame * 0.06) * 8;
        bird.wingAngle += 0.18;
        bird.rotation = Math.sin(frame * 0.06) * 6;
      }
      return;
    }

    // physics
    bird.vy += GRAVITY;
    bird.y  += bird.vy;
    bird.wingAngle += 0.25;

    // rotation
    const targetRot = Math.min(Math.max(bird.vy * 4, -28), 85);
    bird.rotation += (targetRot - bird.rotation) * 0.12;

    // scroll ground
    groundOffset += PIPE_SPEED;

    // spawn pipes
    if (now - lastPipe > PIPE_INTERVAL) {
      pipes.push(createPipe());
      lastPipe = now;
    }

    // move & check pipes
    pipes.forEach((p, i) => {
      p.x -= PIPE_SPEED;
      // score
      if (!p.scored && p.x + PIPE_WIDTH < bird.x) {
        p.scored = true;
        score++;
        updateScoreDisplay(score);
      }
      // collision
      if (bird.alive && checkCollision(p)) die();
    });

    // remove off-screen
    pipes = pipes.filter(p => p.x + PIPE_WIDTH + 30 > 0);

    // ground/ceiling
    if (bird.alive) {
      if (bird.y + bird.radius > H - GROUND_H) {
        bird.y = H - GROUND_H - bird.radius;
        bird.vy = 0;
        die();
      }
      if (bird.y - bird.radius < 0) {
        bird.y = bird.radius;
        bird.vy = 2;
      }
    } else {
      // dead – fall through ground
      if (bird.y + bird.radius > H - GROUND_H + 40) {
        bird.vy = 0;
      }
    }

    if (flashTimer > 0) flashTimer--;
  }

  // ── Main draw loop ────────────────────────────────────
  function draw() {
    ctx.clearRect(0, 0, W, H);

    // flash on death
    if (flashTimer > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flashTimer / 8})`;
      ctx.fillRect(0, 0, W, H);
      return;
    }

    drawSky();
    drawClouds();
    pipes.forEach(drawPipe);
    drawGround();
    drawBird();
  }

  // ── Loop ──────────────────────────────────────────────
  function loop(now) {
    update(now);
    draw();
    animId = requestAnimationFrame(loop);
  }

  // ── Boot ──────────────────────────────────────────────
  bestBadge.textContent = '🏆 BEST: ' + best;
  init();
  requestAnimationFrame(loop);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  :root {
    --sky-top: #4ec0ca;
    --sky-bot: #a8e6f0;
    --pipe: #74bf2e;
    --pipe-dark: #558c1e;
    --pipe-border: #3a6010;
    --ground: #ded895;
    --ground-dark: #c6b45c;
    --bird-y: #f5e642;
    --bird-o: #f0a030;
    --bird-eye: #fff;
    --bird-pupil: #222;
    --bird-beak: #f07830;
    --bird-wing: #f5c830;
    --text: #fff;
    --shadow: rgba(0,0,0,0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Press Start 2P', monospace;
    overflow: hidden;
  }

  #game-wrapper {
    position: relative;
    width: 360px;
    height: 640px;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(78,192,202,0.3), 0 0 0 4px #2d2d44, 0 8px 40px rgba(0,0,0,0.6);
  }

  canvas {
    display: block;
    image-rendering: pixelated;
  }

  #ui-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  /* SCORE */
  #score-display {
    position: absolute;
    top: 28px;
    left: 0; right: 0;
    text-align: center;
    color: #fff;
    font-size: 28px;
    text-shadow: 3px 3px 0 #000, -1px -1px 0 #000;
    letter-spacing: 2px;
    z-index: 10;
    display: none;
  }

  /* START SCREEN */
  #start-screen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: rgba(0,0,0,0.08);
    z-index: 20;
  }

  .game-title {
    font-size: 22px;
    color: #fff;
    text-shadow: 3px 3px 0 #000, -1px -1px 0 #000;
    text-align: center;
    line-height: 1.7;
    animation: titleBob 1.1s ease-in-out infinite alternate;
  }

  @keyframes titleBob {
    from { transform: translateY(0px); }
    to   { transform: translateY(-8px); }
  }

  .tap-hint {
    font-size: 9px;
    color: #fff;
    text-shadow: 2px 2px 0 #000;
    animation: blink 0.9s step-end infinite;
    margin-top: 8px;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .best-tag {
    font-size: 8px;
    color: #ffd700;
    text-shadow: 2px 2px 0 #000;
  }

  /* GAME OVER */
  #gameover-screen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(0,0,0,0.45);
    z-index: 20;
    animation: fadeIn 0.35s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.93); }
    to   { opacity: 1; transform: scale(1); }
  }

  .go-panel {
    background: #f9e17a;
    border: 5px solid #c68c00;
    border-radius: 14px;
    padding: 22px 34px;
    text-align: center;
    box-shadow: 0 6px 0 #8a5e00, 0 10px 30px rgba(0,0,0,0.4);
  }

  .go-title {
    font-size: 17px;
    color: #c0392b;
    text-shadow: 2px 2px 0 #7b1a12;
    margin-bottom: 14px;
  }

  .go-scores {
    font-size: 9px;
    color: #555;
    line-height: 2.2;
  }

  .go-scores span {
    color: #c0392b;
    font-size: 12px;
  }

  .go-btn {
    pointer-events: all;
    margin-top: 14px;
    background: #58cc2e;
    border: 4px solid #3a8c18;
    border-radius: 10px;
    color: #fff;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    padding: 10px 22px;
    cursor: pointer;
    box-shadow: 0 5px 0 #267010;
    transition: transform 0.08s, box-shadow 0.08s;
    text-shadow: 1px 1px 0 #267010;
  }

  .go-btn:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #267010;
  }

  /* Medal */
  .medal {
    width: 44px; height: 44px;
    border-radius: 50%;
    margin: 6px auto;
    font-size: 22px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 8px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>

<div id="game-wrapper">
  <canvas id="c" width="360" height="640"></canvas>

  <div id="score-display">0</div>

  <div id="start-screen">
    <div class="game-title">🐦 FLAPPY<br>BIRD</div>
    <div class="tap-hint">TAP / SPACE / CLICK</div>
    <div class="best-tag" id="start-best">BEST: 0</div>
  </div>

  <div id="gameover-screen">
    <div class="go-panel">
      <div class="go-title">GAME OVER</div>
      <div class="medal" id="medal"></div>
      <div class="go-scores">
        SCORE &nbsp;<span id="final-score">0</span><br>
        BEST &nbsp;&nbsp;<span id="best-score">0</span>
      </div>
      <button class="go-btn" id="restart-btn">▶ PLAY AGAIN</button>
    </div>
  </div>
</div>

<script>
// ─── CANVAS SETUP ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = 360, H = 640;

// ─── GAME STATE ───────────────────────────────────────────────────────────────
let state = 'start'; // 'start' | 'playing' | 'dead'
let score = 0, best = 0, frame = 0;
let hiScore = parseInt(localStorage.getItem('fb_best') || '0');

// ─── PHYSICS ─────────────────────────────────────────────────────────────────
const GRAVITY    = 0.38;
const FLAP_VEL   = -7.2;
const PIPE_SPEED = 2.4;
const PIPE_GAP   = 145;
const GROUND_H   = 80;

// ─── BIRD ─────────────────────────────────────────────────────────────────────
const bird = {
  x: 80, y: H/2,
  vy: 0,
  w: 38, h: 28,
  angle: 0,
  flapAnim: 0, // wing position
  alive: true,
  reset() {
    this.y = H/2; this.vy = 0; this.angle = 0;
    this.alive = true; this.flapAnim = 0;
  },
  flap() { this.vy = FLAP_VEL; },
  update() {
    if (!this.alive) return;
    this.vy += GRAVITY;
    this.y  += this.vy;
    this.angle = Math.min(Math.max(this.vy * 4, -30), 90);
    this.flapAnim = (this.flapAnim + 0.25) % (2 * Math.PI);
  },
  draw() {
    ctx.save();
    ctx.translate(this.x + this.w/2, this.y + this.h/2);
    ctx.rotate(this.angle * Math.PI / 180);

    const bx = -this.w/2, by = -this.h/2;
    const bw = this.w, bh = this.h;

    // Body
    const bodyGrad = ctx.createRadialGradient(2, -2, 2, 2, 0, 18);
    bodyGrad.addColorStop(0, '#ffe566');
    bodyGrad.addColorStop(1, '#f0a030');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.ellipse(0, 0, bw/2, bh/2, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#c07010';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Wing (animated)
    const wingY = Math.sin(this.flapAnim) * 5;
    ctx.fillStyle = '#f5c830';
    ctx.beginPath();
    ctx.ellipse(-4, wingY + 3, 11, 6, -0.4, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#b08010';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Eye white
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(9, -6, 6, 6, 0, 0, Math.PI*2);
    ctx.fill();
    // Pupil
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.ellipse(10.5, -6, 3.5, 3.5, 0, 0, Math.PI*2);
    ctx.fill();
    // Eye shine
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(12, -7.5, 1.5, 1.5, 0, 0, Math.PI*2);
    ctx.fill();

    // Beak
    ctx.fillStyle = '#f07830';
    ctx.beginPath();
    ctx.moveTo(14, -2);
    ctx.lineTo(22, 1);
    ctx.lineTo(14, 4);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#c05010';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Beak middle line
    ctx.strokeStyle = '#c05010';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(14, 1); ctx.lineTo(21, 1);
    ctx.stroke();

    ctx.restore();
  },
  hitBox() {
    return { x: this.x+6, y: this.y+4, w: this.w-10, h: this.h-8 };
  }
};

// ─── PIPES ────────────────────────────────────────────────────────────────────
let pipes = [];
let pipeTimer = 0;
const PIPE_INTERVAL = 88; // frames between pipes

function spawnPipe() {
  const gapY = 140 + Math.random() * (H - GROUND_H - 140 - PIPE_GAP);
  pipes.push({ x: W + 20, gapY, passed: false, wobble: 0 });
}

function drawPipe(p) {
  const pw = 58;
  const capH = 26, capW = pw + 10;

  // TOP PIPE
  const topH = p.gapY;
  // Main body
  const tg = ctx.createLinearGradient(p.x, 0, p.x + pw, 0);
  tg.addColorStop(0, '#5db52a');
  tg.addColorStop(0.3, '#8de050');
  tg.addColorStop(0.7, '#5db52a');
  tg.addColorStop(1, '#3a7a14');
  ctx.fillStyle = tg;
  ctx.fillRect(p.x, 0, pw, topH - capH);
  // Cap
  ctx.fillStyle = '#6ec535';
  ctx.fillRect(p.x - 5, topH - capH, capW, capH);
  // Borders
  ctx.strokeStyle = '#2e6010';
  ctx.lineWidth = 2;
  ctx.strokeRect(p.x - 5, topH - capH, capW, capH);
  ctx.strokeRect(p.x, 0, pw, topH - capH);
  // Highlight
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(p.x + 4, 0, 10, topH - capH);

  // BOTTOM PIPE
  const botY = p.gapY + PIPE_GAP;
  const botH = H - GROUND_H - botY;
  const bg2 = ctx.createLinearGradient(p.x, 0, p.x + pw, 0);
  bg2.addColorStop(0, '#5db52a');
  bg2.addColorStop(0.3, '#8de050');
  bg2.addColorStop(0.7, '#5db52a');
  bg2.addColorStop(1, '#3a7a14');
  ctx.fillStyle = bg2;
  ctx.fillRect(p.x, botY + capH, pw, botH);
  // Cap
  ctx.fillStyle = '#6ec535';
  ctx.fillRect(p.x - 5, botY, capW, capH);
  ctx.strokeStyle = '#2e6010';
  ctx.lineWidth = 2;
  ctx.strokeRect(p.x - 5, botY, capW, capH);
  ctx.strokeRect(p.x, botY + capH, pw, botH);
  // Highlight
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(p.x + 4, botY + capH, 10, botH);
}

// ─── BACKGROUND / CLOUDS ──────────────────────────────────────────────────────
let clouds = [
  { x: 60,  y: 80,  w: 90, s: 0.4 },
  { x: 200, y: 55,  w: 70, s: 0.3 },
  { x: 310, y: 100, w: 80, s: 0.35 },
];

function drawBg() {
  // Sky gradient
  const skyG = ctx.createLinearGradient(0, 0, 0, H - GROUND_H);
  skyG.addColorStop(0,   '#3ab4c2');
  skyG.addColorStop(0.6, '#7dd8e8');
  skyG.addColorStop(1,   '#b8eefd');
  ctx.fillStyle = skyG;
  ctx.fillRect(0, 0, W, H - GROUND_H);

  // Clouds
  clouds.forEach(cl => {
    ctx.fillStyle = 'rgba(255,255,255,0.88)';
    ctx.beginPath();
    ctx.ellipse(cl.x, cl.y, cl.w/2, 18, 0, 0, Math.PI*2);
    ctx.ellipse(cl.x - cl.w*0.22, cl.y+8, cl.w*0.3, 14, 0, 0, Math.PI*2);
    ctx.ellipse(cl.x + cl.w*0.22, cl.y+8, cl.w*0.3, 14, 0, 0, Math.PI*2);
    ctx.fill();
  });
}

let groundOffset = 0;
function drawGround() {
  // Dirt
  ctx.fillStyle = '#c6b45c';
  ctx.fillRect(0, H - GROUND_H, W, GROUND_H);

  // Grass strip
  ctx.fillStyle = '#79c025';
  ctx.fillRect(0, H - GROUND_H, W, 20);

  // Grass pattern
  ctx.fillStyle = '#5da015';
  for (let i = 0; i < W; i += 18) {
    const gx = (i - groundOffset % 18);
    ctx.beginPath();
    ctx.moveTo(gx, H - GROUND_H + 20);
    ctx.lineTo(gx + 6, H - GROUND_H + 6);
    ctx.lineTo(gx + 12, H - GROUND_H + 20);
    ctx.fill();
  }

  // Ground stripes
  ctx.fillStyle = '#b8a452';
  for (let i = 0; i < W; i += 40) {
    const sx = (i - groundOffset % 40);
    ctx.fillRect(sx, H - GROUND_H + 22, 20, GROUND_H - 22);
  }
}

// ─── PARTICLES ────────────────────────────────────────────────────────────────
let particles = [];
function spawnFeathers() {
  for (let i = 0; i < 8; i++) {
    particles.push({
      x: bird.x + bird.w/2, y: bird.y + bird.h/2,
      vx: (Math.random()-0.5)*4, vy: (Math.random()-2)*3,
      life: 1, color: i%2===0 ? '#f5e642' : '#f5c830',
      r: 4 + Math.random()*4
    });
  }
}

function updateParticles() {
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.12; p.life -= 0.025;
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, p.r, p.r * 0.5, p.vx * 0.3, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
}

// ─── SCORE POP ────────────────────────────────────────────────────────────────
let scorePops = [];
function addScorePop() {
  scorePops.push({ x: W/2, y: 100, life: 1 });
}
function drawScorePops() {
  scorePops = scorePops.filter(p => p.life > 0);
  scorePops.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${12 + (1 - p.life) * 8}px 'Press Start 2P'`;
    ctx.textAlign = 'center';
    ctx.fillText('+1', p.x, p.y - (1 - p.life) * 30);
    p.life -= 0.04;
    ctx.globalAlpha = 1;
  });
}

// ─── COLLISION ────────────────────────────────────────────────────────────────
function checkCollision() {
  const hb = bird.hitBox();
  // Ground
  if (bird.y + bird.h >= H - GROUND_H) return true;
  // Ceiling
  if (bird.y <= 0) return true;
  // Pipes
  for (const p of pipes) {
    const pw = 58;
    const inX = hb.x + hb.w > p.x - 4 && hb.x < p.x + pw + 4;
    if (inX) {
      if (hb.y < p.gapY || hb.y + hb.h > p.gapY + PIPE_GAP) return true;
    }
  }
  return false;
}

// ─── MAIN LOOP ────────────────────────────────────────────────────────────────
let animId;
function gameLoop() {
  frame++;
  ctx.clearRect(0, 0, W, H);

  // BG
  drawBg();

  // Clouds move
  if (state === 'playing') {
    clouds.forEach(cl => {
      cl.x -= cl.s;
      if (cl.x + cl.w < 0) cl.x = W + cl.w;
    });
    groundOffset += PIPE_SPEED;
  }

  // Pipes
  if (state === 'playing') {
    pipeTimer++;
    if (pipeTimer >= PIPE_INTERVAL) { spawnPipe(); pipeTimer = 0; }
    pipes.forEach(p => {
      p.x -= PIPE_SPEED;
      if (!p.passed && p.x + 58 < bird.x) {
        p.passed = true; score++;
        document.getElementById('score-display').textContent = score;
        addScorePop();
        // Score sound effect via Web Audio
        playPoint();
      }
    });
    pipes = pipes.filter(p => p.x > -80);
  }

  pipes.forEach(p => drawPipe(p));

  // Ground
  drawGround();

  // Particles
  updateParticles();

  // Bird
  if (state === 'playing') {
    bird.update();
    if (checkCollision()) die();
  } else if (state === 'start') {
    // Bob bird
    bird.y = H/2 - 20 + Math.sin(frame * 0.06) * 8;
    bird.angle = 0;
    bird.flapAnim = (bird.flapAnim + 0.2) % (Math.PI * 2);
  }

  bird.draw();
  drawScorePops();

  animId = requestAnimationFrame(gameLoop);
}

// ─── DIE ─────────────────────────────────────────────────────────────────────
function die() {
  if (!bird.alive) return;
  bird.alive = false;
  state = 'dead';
  spawnFeathers();
  playHit();

  if (score > hiScore) {
    hiScore = score;
    localStorage.setItem('fb_best', hiScore);
  }

  setTimeout(() => {
    document.getElementById('final-score').textContent = score;
    document.getElementById('best-score').textContent = hiScore;

    const medalEl = document.getElementById('medal');
    if (score >= 30)      { medalEl.textContent = '🏆'; medalEl.style.background = '#ffd700'; }
    else if (score >= 20) { medalEl.textContent = '🥇'; medalEl.style.background = '#ffd700'; }
    else if (score >= 10) { medalEl.textContent = '🥈'; medalEl.style.background = '#c0c0c0'; }
    else if (score >= 5)  { medalEl.textContent = '🥉'; medalEl.style.background = '#cd7f32'; }
    else                  { medalEl.textContent = '💀'; medalEl.style.background = '#eee'; }

    document.getElementById('gameover-screen').style.display = 'flex';
  }, 600);
}

// ─── START / RESTART ─────────────────────────────────────────────────────────
function startGame() {
  score = 0; frame = 0; pipes = []; pipeTimer = 60; particles = []; scorePops = [];
  bird.reset();
  bird.x = 80; bird.y = H/2;
  state = 'playing';
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('gameover-screen').style.display = 'none';
  document.getElementById('score-display').style.display = 'block';
  document.getElementById('score-display').textContent = '0';
  document.getElementById('start-best').textContent = 'BEST: ' + hiScore;
}

function restartGame() {
  document.getElementById('gameover-screen').style.display = 'none';
  document.getElementById('start-best').textContent = 'BEST: ' + hiScore;
  startGame();
}

// ─── CONTROLS ────────────────────────────────────────────────────────────────
function handleInput() {
  if (state === 'start') { startGame(); return; }
  if (state === 'playing') { bird.flap(); playFlap(); }
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); handleInput(); }
});
canvas.addEventListener('click', handleInput);
canvas.addEventListener('touchstart', e => { e.preventDefault(); handleInput(); }, { passive: false });
document.getElementById('restart-btn').addEventListener('click', restartGame);

// ─── AUDIO (Web Audio API) ────────────────────────────────────────────────────
let audioCtx;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playFlap() {
  try {
    const a = getAudio();
    const o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination);
    o.type = 'square';
    o.frequency.setValueAtTime(600, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(400, a.currentTime + 0.08);
    g.gain.setValueAtTime(0.12, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.1);
    o.start(); o.stop(a.currentTime + 0.1);
  } catch(e) {}
}

function playPoint() {
  try {
    const a = getAudio();
    const o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(800, a.currentTime);
    o.frequency.setValueAtTime(1100, a.currentTime + 0.05);
    g.gain.setValueAtTime(0.18, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.2);
    o.start(); o.stop(a.currentTime + 0.2);
  } catch(e) {}
}

function playHit() {
  try {
    const a = getAudio();
    const o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination);
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(300, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(80, a.currentTime + 0.3);
    g.gain.setValueAtTime(0.25, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.35);
    o.start(); o.stop(a.currentTime + 0.35);
  } catch(e) {}
}

// ─── KICK IT OFF ─────────────────────────────────────────────────────────────
document.getElementById('start-best').textContent = 'BEST: ' + hiScore;
gameLoop();
</script>
</body>
</html>

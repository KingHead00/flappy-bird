<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flappy Bird</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="game-wrapper">
  <canvas id="gameCanvas" width="360" height="640"></canvas>

  <div id="ui-overlay">
    <div id="score-display">0</div>

    <div id="screen">
      <div class="screen-box" id="start-screen">
        <div class="screen-title">🐦 FLAPPY<br>BIRD</div>
        <div class="screen-sub">Dodge the pipes<br>Score as high as you can!</div>
        <div class="tap-hint">[ TAP / CLICK / SPACE ]</div>
      </div>

      <div class="screen-box" id="over-screen" style="display:none;">
        <div class="screen-title">GAME OVER</div>
        <div class="medal" id="medal-icon">💀</div>
        <div class="screen-score" id="final-score">Score: 0</div>
        <div id="best-badge">🏆 BEST: 0</div>
        <div class="tap-hint">[ TAP TO RETRY ]</div>
      </div>
    </div>
  </div>
</div>

<div id="instructions">SPACE · CLICK · TAP to flap</div>

<script src="game.js"></script>
</body>
</html>
